name: CI

# 构建 + 测试（MTP 模式）+ 覆盖率门禁。NuGet 发布由 publish.yml 负责（手动触发或 v* 标签）。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # 允许手工触发，便于验证流水线本身
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新推送取消尚在排队/运行的旧任务，避免堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # global.json 锁定 10.0.3xx 功能带（latestPatch）并启用 MTP 测试运行器，
          # setup-dotnet 会按其精确安装 10.0.302。
          global-json-file: global.json

      - name: 还原
        # 传递依赖中的高危/严重漏洞已由 common.props 的
        # WarningsAsErrors(NU1903/NU1904) 门禁在构建阶段拦截。
        run: dotnet restore framework/XiHan.Framework.slnx

      - name: 构建
        # GeneratePackageOnBuild 在本仓默认开启，CI 不需要产包，关掉省时间
        run: >
          dotnet build framework/XiHan.Framework.slnx
          --configuration Release
          --no-restore
          -p:GeneratePackageOnBuild=false

      - name: 测试（MTP 模式，采集覆盖率）
        # dotnet test 由 global.json 的 test.runner 直接驱动 Microsoft.Testing.Platform
        # 测试应用；--coverage 经 TestingPlatformCommandLineArguments 透传给每个测试程序，
        # 覆盖率文件统一产出到 framework/TestResults/。失败即中断。
        run: >
          dotnet test framework/XiHan.Framework.slnx
          --configuration Release
          --no-build
          -p:TestingPlatformCommandLineArguments="--coverage --coverage-output-format cobertura"

      - name: 合并覆盖率报告
        # MTP 模式下各测试应用的 cobertura 文件统一落在 framework/TestResults/ 下
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:framework/TestResults/*.cobertura.xml" \
            "-targetdir:${{ runner.temp }}/coverage" \
            "-reporttypes:JsonSummary"

      - name: 覆盖率门禁
        # 当前实测（2026-08，补盲后）：行覆盖率 13.3%、覆盖 8157 行。
        # 阈值只做「防止大幅回退」：覆盖行数与百分比双下限，随测试补齐逐步上调。
        run: |
          python3 - <<'PY'
          import json
          with open("${{ runner.temp }}/coverage/Summary.json", encoding="utf-8") as f:
              data = json.load(f)
          summary = data["summary"]
          line_coverage = float(summary["linecoverage"])
          covered_lines = int(summary["coveredlines"])
          min_covered_lines = 6800
          min_line_coverage = 11.0
          print(f"Line coverage: {line_coverage}%, covered lines: {covered_lines}")
          print(f"Thresholds: >= {min_line_coverage}% and >= {min_covered_lines} covered lines")
          if covered_lines < min_covered_lines or line_coverage < min_line_coverage:
              raise SystemExit(
                  f"Coverage regressed: {line_coverage}% / {covered_lines} lines is below "
                  f"{min_line_coverage}% / {min_covered_lines} lines")
          PY

      - name: 上传测试结果与覆盖率
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            framework/TestResults/
          if-no-files-found: ignore
