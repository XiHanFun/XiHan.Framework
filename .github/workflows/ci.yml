name: CI

# 构建 + 测试（MTP 模式）+ 覆盖率门禁。NuGet 发布由 publish.yml 负责（手动触发或 v* 标签）。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # 允许手工触发，便于验证流水线本身
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新推送取消尚在排队/运行的旧任务，避免堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # global.json 锁定 10.0.1xx 功能带（latestPatch）并启用 MTP 测试运行器，
          # setup-dotnet 会按其精确安装对应补丁。
          global-json-file: global.json

      - name: 还原
        # 传递依赖中的高危/严重漏洞已由 common.props 的
        # WarningsAsErrors(NU1903/NU1904) 门禁在构建阶段拦截。
        run: dotnet restore framework/XiHan.Framework.slnx

      - name: 构建
        # GeneratePackageOnBuild 在本仓默认开启，CI 不需要产包，关掉省时间
        run: >
          dotnet build framework/XiHan.Framework.slnx
          --configuration Release
          --no-restore
          -p:GeneratePackageOnBuild=false

      - name: 测试（MTP 模式，采集覆盖率）
        # dotnet test 由 global.json 的 test.runner 直接驱动 Microsoft.Testing.Platform
        # 测试应用；--coverage 经 TestingPlatformCommandLineArguments 透传给每个测试程序，
        # 覆盖率文件产出到工作目录下的 TestResults/。失败即中断。
        # MTP 模式下解决方案必须经 --solution 传入，位置参数会被直接拒绝。
        run: >
          dotnet test --solution framework/XiHan.Framework.slnx
          --configuration Release
          --no-build
          -p:TestingPlatformCommandLineArguments="--coverage --coverage-output-format cobertura"

      - name: 合并覆盖率报告
        # 覆盖率产物并不落在 dotnet test 的工作目录，而是每个测试工程各自的
        # bin/<配置>/<TFM>/TestResults/ 下，因此必须递归匹配。
        # 早先这里只在仓库根的 TestResults/ 里找，一个文件都匹配不到，
        # 合并出来的 Summary.json 是空的，下面的门禁等于从未生效。
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:framework/test/**/TestResults/*.cobertura.xml" \
            "-targetdir:${{ runner.temp }}/coverage" \
            "-reporttypes:JsonSummary;Html"

      - name: 覆盖率门禁
        # 基线取自 CI run 33190021582（2026-08-29，dev 分支）：
        # 行覆盖率 45.1%、覆盖 34236 行、可覆盖 75774 行、分支覆盖 43.6%、66 个程序集。
        # 阈值只做「防止大幅回退」：覆盖行数与百分比双下限，各留约一成裕度，随测试补齐逐步上调。
        #
        # 重新标定一律以本步骤在 CI 上打印的值为准，并把来源 run 号写进本注释；
        # 不要拿本机跑出来的数字设阈值——上一版 41% / 44000 行就是这么来的：
        # 它在 CI 上从未通过过一次（设定它的那次运行自己在测试步就失败、门禁步被 skip），
        # 而 44000 比 CI 实测高出 28.5%，结构上不可能通过。
        run: |
          python3 - <<'PY'
          import json
          with open("${{ runner.temp }}/coverage/Summary.json", encoding="utf-8") as f:
              data = json.load(f)
          summary = data["summary"]
          parser = summary["parser"]
          assemblies = int(summary["assemblies"])
          line_coverage = float(summary["linecoverage"])
          covered_lines = int(summary["coveredlines"])
          coverable_lines = int(summary["coverablelines"])
          branch_coverage = float(summary["branchcoverage"])
          min_covered_lines = 30000
          min_line_coverage = 41.0
          # 分母（可覆盖行）与程序集数一并打印：只看分子无法区分「测试变差」与「统计范围缩小」，
          # 这两种故障的百分比表现可以完全一样。
          print(f"Parser: {parser}, assemblies: {assemblies}")
          print(f"Line coverage: {line_coverage}%, covered lines: {covered_lines}, coverable lines: {coverable_lines}")
          print(f"Branch coverage: {branch_coverage}%")
          print(f"Thresholds: >= {min_line_coverage}% and >= {min_covered_lines} covered lines")
          failures = []
          if line_coverage < min_line_coverage:
              failures.append(f"行覆盖率 {line_coverage}% 低于下限 {min_line_coverage}%")
          if covered_lines < min_covered_lines:
              failures.append(f"覆盖行数 {covered_lines} 低于下限 {min_covered_lines}")
          if failures:
              raise SystemExit("覆盖率门禁未通过：" + "；".join(failures))
          PY

      - name: 上传测试结果与覆盖率
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            framework/test/**/TestResults/
          if-no-files-found: ignore

      - name: 上传合并后的覆盖率报告
        # 门禁一红就得有据可查：没有这份合并报告，排查只能回到本机复现，
        # 而本机复现正是上一版错误基线的来源。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage/
          if-no-files-found: ignore
