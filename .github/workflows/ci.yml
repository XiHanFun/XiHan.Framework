name: CI

# 框架的构建、测试与门禁。只在 framework/ 或本文件变动时触发；NuGet 发布由 release.yml 负责。
on:
  push:
    branches: [dev, preview, main]
    paths:
      - "framework/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [dev, preview, main]
    paths:
      - "framework/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # preview 上每个提交都要跑出完整结论，发版时以它为据
  cancel-in-progress: ${{ github.ref != 'refs/heads/preview' }}

jobs:
  build:
    name: 构建、测试与门禁
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      sqlserver:
        # Persistence.SqlSugar 的 SQL Server 用例（筛选索引、库结构读取与一致性套件）；口令只给 CI 的一次性容器用
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: XiHan_Test_2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P XiHan_Test_2026 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mysql:
        # Persistence.SqlSugar 的 MySQL 用例（库结构读取与一致性套件，每个用例建删一个库）；9.7 是 LTS，镜像小、起得快，放在主作业里
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: XiHan_Test_2026
        ports:
          - 3306:3306
        # 走 TCP（-h 127.0.0.1）：镜像初始化期间的临时服务器不开网络，初始化完、正式服务器起来之后才报健康
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pXiHan_Test_2026 --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      qdrant:
        # AI.VectorData 的真实 Qdrant 用例（一致性套件与摄入、检索）。镜像里没有 curl、wget，不配健康检查；用到它之前的还原与构建要几分钟，够它就绪
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6334:6334
    runs-on: ubuntu-latest

    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          # framework/spec 是 framework-spec 的 submodule
          submodules: true

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 安装 Go
        # Plugins.OutOfProcess.Tests 在运行时构建 samples/EchoGoPlugin（Go 插件端到端）；没有 go 会跳过
        uses: actions/setup-go@v6
        with:
          go-version-file: framework/samples/EchoGoPlugin/go.mod
          cache-dependency-path: framework/samples/EchoGoPlugin/go.sum

      - name: 还原
        # NU1903/NU1904 在 framework/Directory.Build.props 中升级为错误，高危漏洞在此中断
        run: dotnet restore framework/XiHan.Framework.slnx

      - name: 构建
        # TreatWarningsAsErrors + latest-recommended 分析器 + PublicAPI 分析器 + AOT 分析器
        run: dotnet build framework/XiHan.Framework.slnx --configuration Release --no-restore

      - name: 测试（MTP 模式，采集覆盖率）
        env:
          # Caching.Redis、Messaging.RabbitMQ、Persistence.SqlSugar（PostgreSQL、SQL Server、MySQL）与 Workflow.Database（PostgreSQL）的门控用例只在设置了这些变量时运行；
          # Oracle 的门控用例（XIHAN_TEST_ORACLE）在下面单独的 oracle 作业里跑，这里不设、跳过
          XIHAN_TEST_REDIS: localhost:6379
          XIHAN_TEST_RABBITMQ: amqp://guest:guest@localhost:5672
          XIHAN_TEST_QDRANT: http://localhost:6334
          XIHAN_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
          XIHAN_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=XiHan_Test_2026;TrustServerCertificate=True
          XIHAN_TEST_MYSQL: Server=localhost;Port=3306;User Id=root;Password=XiHan_Test_2026
        # 含架构测试：依赖方向、包 ID 文法、命名空间、零反射、第三方类型泄漏、版权头
        run: >
          dotnet test --solution framework/XiHan.Framework.slnx
          --configuration Release
          --no-build
          -p:TestingPlatformCommandLineArguments="--coverage --coverage-output-format cobertura"

      - name: 打包（触发包验证与 README 检查）
        run: dotnet pack framework/XiHan.Framework.slnx --configuration Release --no-build

      - name: 依赖漏洞清单
        run: dotnet list framework/XiHan.Framework.slnx package --vulnerable --include-transitive

      - name: 安装 Native AOT 工具链
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: AOT 发布冒烟
        # 内核零反射、源生成序列化：示例必须能以 Native AOT 发布
        # PublishAot 由 SimpleApp 项目声明；不在命令行传，否则作为全局属性传给 netstandard2.0 的分析器与生成器（NETSDK1207）
        run: dotnet publish framework/samples/SimpleApp/SimpleApp.csproj --configuration Release -o ${{ runner.temp }}/aot

      - name: 上传测试结果与包
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts
          path: |
            framework/test/**/TestResults/
            framework/artifacts/packages/
          if-no-files-found: ignore

  oracle:
    # Persistence.SqlSugar 的 Oracle 门控用例（库结构读取与一致性套件，每个用例建删一个用户）。Oracle 镜像大、冷启动慢，
    # 单独一个作业与主作业并行：只还原、构建、测试这一个测试项目，拉镜像与启动的时间不压在主作业上
    name: Oracle 门控用例
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      oracle:
        # slim-faststart：裁掉了不用的组件、库在镜像里已经建好，启动只要打开实例，不用现建库；与本机验证所用相同
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: XiHan_Test_2026
        ports:
          - 1521:1521
        # healthcheck.sh 是镜像自带的就绪检查（可插拔库 FREEPDB1 打开后才成功）
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 20s
          --health-retries 30

    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 还原
        run: dotnet restore framework/test/XiHan.Framework.Persistence.SqlSugar.Tests/XiHan.Framework.Persistence.SqlSugar.Tests.csproj

      - name: 构建
        run: dotnet build framework/test/XiHan.Framework.Persistence.SqlSugar.Tests/XiHan.Framework.Persistence.SqlSugar.Tests.csproj --configuration Release --no-restore

      - name: 测试（Oracle）
        env:
          # SYSTEM 能建删用户；只设这一个变量，其余数据库的门控用例在主作业里跑，这里跳过
          XIHAN_TEST_ORACLE: User Id=system;Password=XiHan_Test_2026;Data Source=localhost:1521/FREEPDB1
        run: >
          dotnet test --project framework/test/XiHan.Framework.Persistence.SqlSugar.Tests/XiHan.Framework.Persistence.SqlSugar.Tests.csproj
          --configuration Release
          --no-build

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-artifacts
          path: framework/test/XiHan.Framework.Persistence.SqlSugar.Tests/TestResults/
          if-no-files-found: ignore
