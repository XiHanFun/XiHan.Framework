name: 发布 NuGet

# 推送 v* 标签（如 vX.Y.Z-preview.N、vX.Y.Z）触发，打包 framework/XiHan.Framework.slnx，
# 包在 framework/artifacts/packages/，统一推送 nuget.org（--skip-duplicate 幂等）。
#
# 发包必须同时满足两条，由 guard job 把关，缺一不发：
# ① 标签指向的提交在发布分支的历史里：带预发布后缀的是预览版，看 preview；不带的是正式版，看 main。
#    标签本身不带分支信息，所以要查祖先关系——打在别处的 v* 标签一律拒发。
# ② 标签号就是 framework/Directory.Build.props 的 <Version>——否则发出去的不是你以为的那个版本，
#    而 --skip-duplicate 还会把这种错静默吞掉。
# 手动 Run workflow 时必须选中一个版本标签；选分支会被 ① 拦下。
#
# 只管发布，不跑测试：测试门禁在 ci.yml，提交进发布分支时已经跑过；
# 这里只留产包与推送本身绕不开的步骤。
#
# 认证走 NuGet 可信发布（OIDC），无长期 API Key。
# nuget.org → 受信任的发布 → 添加策略：存储库所有者 XiHanFun、存储库 XiHan.Framework、
# 工作流文件 release.yml、环境留空。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: 校验标签
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          # 要拿完整历史才能判断祖先关系
          fetch-depth: 0

      - name: 预览版标签只放行 preview，正式版标签只放行 main
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::发布只接受版本标签触发，收到 $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          # 带预发布后缀（v1.0.0-rc.1）的是预览版
          case "$GITHUB_REF_NAME" in
            *-*) branch=preview ;;
            *) branch=main ;;
          esac
          git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch"; then
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 $branch 的历史里，拒绝发布。先把要发布的提交快进到 $branch，再在上面打标签。"
            exit 1
          fi
          echo "标签 $GITHUB_REF_NAME 在 $branch 上，放行"

      - name: 标签号与 <Version> 对账
        run: |
          version="$(grep -oP '(?<=<Version>)[^<]+' framework/Directory.Build.props)"
          if [ -z "$version" ]; then
            echo "::error::framework/Directory.Build.props 里没读到 <Version>，拒绝发布。"
            exit 1
          fi
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 framework/Directory.Build.props 的 <Version>$version</Version> 不一致，拒绝发布。先把版本提到位并快进到发布分支，再在那个提交上打 v$version。"
            exit 1
          fi
          echo "标签 $GITHUB_REF_NAME 与 <Version> 的 $version 一致，放行"

  publish:
    name: 构建并推送 NuGet 包
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # 颁发 GitHub OIDC 令牌，NuGet/login 用它换取 1 小时有效的临时 API Key

    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          # framework/spec 是 framework-spec 的 submodule
          submodules: true

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 打包
        # 包统一输出到 framework/artifacts/packages/；包验证与 README 检查在打包时执行。
        run: dotnet pack framework/XiHan.Framework.slnx --configuration Release

      - name: NuGet 可信发布登录（OIDC 换临时 API Key）
        # 经 nuget.org 受信任发布策略校验后返回 1 小时有效的临时 Key，无长期机密。
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: zhaifanhua

      - name: 推送 NuGet 包
        # dotnet nuget push 一次只接受一个包，逐个循环推送；--skip-duplicate 保证重跑幂等。
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in framework/artifacts/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: 上传包构件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: framework/artifacts/packages/*.nupkg
          if-no-files-found: ignore
