name: 发布 NuGet

# 手动触发或推送 v* 标签（如 v3.13.1）。版本号取自 framework/props/version.props，
# 构建产出 66 个包到 framework/nupkgs/，测试通过后统一推送 nuget.org（--skip-duplicate 幂等）。
# 前置条件：仓库 Secrets 中配置 NUGET_API_KEY（nuget.org 的 API Key）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建、测试并推送 NuGet 包
    runs-on: ubuntu-latest

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 显示版本
        run: grep -oP "(?<=<Version>)[^<]+" framework/props/version.props

      - name: 还原
        run: dotnet restore framework/XiHan.Framework.slnx

      - name: 构建（含打包）
        # GeneratePackageOnBuild 默认开启（nuget.props），66 个包统一输出到 framework/nupkgs/；
        # 高危/严重依赖漏洞由 common.props 的 NU1903/NU1904 门禁在构建期拦截。
        run: >
          dotnet build framework/XiHan.Framework.slnx
          --configuration Release
          --no-restore

      - name: 测试
        run: >
          dotnet test framework/XiHan.Framework.slnx
          --configuration Release
          --no-build

      - name: 推送 NuGet 包
        # dotnet nuget push 一次只接受一个包，逐个循环推送；--skip-duplicate 保证重跑幂等。
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in framework/nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: 上传包构件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: framework/nupkgs/*.nupkg
          if-no-files-found: ignore
