name: 发布 NuGet

# 手动触发或推送 v* 标签（如 v3.13.1）。版本号取自 framework/props/version.props，
# 构建产出 66 个包到 framework/nupkgs/，统一推送 nuget.org（--skip-duplicate 幂等）。
#
# 只管发布，不跑测试：测试与覆盖率门禁在 ci.yml，提交进 main 时已经跑过；
# 这里只留产包与推送本身绕不开的步骤。
#
# 认证走 NuGet 可信发布（OIDC），无长期 API Key。
# nuget.org → 受信任的发布 → 添加策略：存储库所有者 XiHanFun、存储库 XiHan.Framework、
# 工作流文件 publish.yml、环境留空。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # 颁发 GitHub OIDC 令牌，NuGet/login 用它换取 1 小时有效的临时 API Key

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建并推送 NuGet 包
    runs-on: ubuntu-latest

    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 显示版本
        run: grep -oP "(?<=<Version>)[^<]+" framework/props/version.props

      - name: 还原
        run: dotnet restore framework/XiHan.Framework.slnx

      - name: 构建（含打包）
        # GeneratePackageOnBuild 默认开启（nuget.props），66 个包统一输出到 framework/nupkgs/；
        # 高危/严重依赖漏洞由 common.props 的 NU1903/NU1904 门禁在构建期拦截。
        run: >
          dotnet build framework/XiHan.Framework.slnx
          --configuration Release
          --no-restore

      - name: NuGet 可信发布登录（OIDC 换临时 API Key）
        # 经 nuget.org 受信任发布策略校验后返回 1 小时有效的临时 Key，无长期机密。
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: zhaifanhua

      - name: 推送 NuGet 包
        # dotnet nuget push 一次只接受一个包，逐个循环推送；--skip-duplicate 保证重跑幂等。
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in framework/nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: 上传包构件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: framework/nupkgs/*.nupkg
          if-no-files-found: ignore
