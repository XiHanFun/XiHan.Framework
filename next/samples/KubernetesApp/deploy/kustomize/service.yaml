apiVersion: v1
kind: Service
metadata:
  name: kubernetes-app
  labels:
    app.kubernetes.io/name: kubernetes-app
    app.kubernetes.io/version: 5.0.0-preview.1
    xihan.profile: full
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubernetes-app
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
