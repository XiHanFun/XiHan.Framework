apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-app-leader
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [kubernetes-app-scheduler]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-app-leader
subjects:
  - kind: ServiceAccount
    name: kubernetes-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-app-leader
